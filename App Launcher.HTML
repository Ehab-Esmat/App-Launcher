<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qoyod Apps Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f8fafc; --border:#e3e8f0; --border-strong:#cfd8e6;
  --text:#14204a; --text-2:#5b6683; --text-3:#8a94ad;
  --brand:#0a6cf0; --brand-2:#3cc8e8; --brand-ink:#ffffff; --navy:#1b2a6b;
  --ok:#14b8a6; --ok-bg:#e6f8f6; --shadow:0 1px 2px rgba(20,32,74,.06),0 4px 16px rgba(20,32,74,.05);
  --tile-shadow:0 6px 16px -6px rgba(20,32,74,.35);
  --lock-bg:#eef1f6; --lock-ink:#9aa3b8; --overlay:rgba(12,20,48,.45);
  --radius:16px;
}
:root[data-theme="dark"]{
  --bg:#0b1430; --surface:#121d3f; --surface-2:#0f1936; --border:#22305c; --border-strong:#2e3e70;
  --text:#eef2ff; --text-2:#a9b4d6; --text-3:#7482ad;
  --brand:#3d8bff; --brand-2:#3cc8e8; --navy:#dfe6ff;
  --ok:#2dd4bf; --ok-bg:rgba(45,212,191,.12); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --tile-shadow:0 8px 20px -8px rgba(0,0,0,.7);
  --lock-bg:#1a2550; --lock-ink:#5d6b98; --overlay:rgba(3,8,24,.65);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
:root[lang="ar"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,Tahoma,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px;color:var(--navy);display:flex;align-items:center;gap:2px;white-space:nowrap}
.logo .dot{width:6px;height:6px;border-radius:50%;background:var(--brand-2);display:inline-block;margin-top:14px}
.searchbtn{flex:1;max-width:420px;margin-inline-start:auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text-3);text-align:start}
.searchbtn span:not(.kbd){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-size:11px;border:1px solid var(--border-strong);border-radius:6px;padding:1px 6px;color:var(--text-3);background:var(--surface)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;font-weight:600;color:var(--text);flex:none}
.iconbtn:hover,.searchbtn:hover{border-color:var(--border-strong)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--brand-2);flex:none}
:root[data-theme="dark"] .avatar{background:#2a3a78;color:#fff}

/* Welcome */
.welcome{margin-top:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 28px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.welcome::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.welcome .badge{width:52px;height:52px;border-radius:14px;background:#1b2a6b;display:grid;place-items:center;color:var(--brand-2);flex:none;box-shadow:0 8px 18px -6px rgba(27,42,107,.6)}
.welcome .date{color:var(--brand);font-size:13px;font-weight:500}
.welcome h1{margin:2px 0;font-size:26px;line-height:1.2;color:var(--navy)}
.welcome .who{color:var(--text-2);font-size:13px}
.welcome .who b{color:var(--text);font-weight:600}
.tfa{margin-inline-start:auto;border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--text-3)}
.tfa a{display:block;color:var(--brand);font-weight:600;font-size:13px;text-decoration:none;margin-top:2px}

/* Section titles */
.sec-title{display:flex;align-items:center;gap:10px;margin:36px 0 14px;font-size:18px;font-weight:600;color:var(--navy)}
.sec-title::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand-2)}
.sec-title.alt::before{background:var(--brand)}
.count{font-size:12px;font-weight:600;color:var(--text-2);background:var(--lock-bg);border-radius:999px;padding:1px 8px}
.sec-sub{color:var(--text-3);font-size:13px;font-weight:400;margin-inline-start:auto}

/* Quick access */
.quick{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:12px}
.quick-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.quick-label{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;width:72px;flex:none}
:root[lang="ar"] .quick-label{letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-size:13px;font-weight:500}
.chip:hover{border-color:var(--border-strong);background:var(--surface)}
.chip .mini{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff}
.chip .mini svg{width:14px;height:14px}
.chip small{color:var(--text-3);font-weight:400}
.empty{color:var(--text-3);font-size:13px}

/* Product sections */
.product{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.p-head{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.p-logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--pc);white-space:nowrap}
.p-logo .mark{width:32px;height:32px;border-radius:50%;border:5px solid var(--pc);position:relative;flex:none}
.p-logo .mark::after{content:"";position:absolute;width:7px;height:7px;border-radius:2px;background:var(--pacc,var(--brand-2));inset-inline-end:-6px;bottom:-6px}
:root[data-theme="dark"] .p-logo{color:var(--pc-dark,var(--pc))}
:root[data-theme="dark"] .p-logo .mark{border-color:var(--pc-dark,var(--pc))}
.p-meta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.p-meta .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:2px 9px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.off{color:var(--text-2);background:var(--lock-bg)}
.p-desc{color:var(--text-2);font-size:13px}
.p-actions{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.last{color:var(--text-3);font-size:12px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:13px;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--brand)}
.btn-ghost:hover{border-color:var(--brand)}
.btn svg{width:16px;height:16px}
:root[dir="rtl"] .flip{transform:scaleX(-1)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;padding:18px 14px 20px}
.tile{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 6px;border-radius:14px;border:0;background:transparent;text-align:center}
.tile:hover{background:var(--surface-2)}
.tile:focus-visible,.chip:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.searchbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tile .ic{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:var(--tile-shadow);transition:transform .15s}
.tile:hover .ic{transform:translateY(-2px)}
.tile .ic svg{width:28px;height:28px}
.tile .nm{font-size:13px;font-weight:600;line-height:1.25;color:var(--text)}
.pin{position:absolute;top:4px;inset-inline-end:8px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);background:var(--surface);border:1px solid var(--border);opacity:0;transition:opacity .15s}
.tile-wrap:hover .pin,.tile-wrap:focus-within .pin,.pin.on{opacity:1}
@media (hover:none){.pin{opacity:1}}
.pin.on{color:#f5a524;border-color:#f5d48a}
.pin svg{width:14px;height:14px}
.locked .tile .ic{background:var(--lock-bg)!important;color:var(--lock-ink);box-shadow:none}
.locked .tile .nm{color:var(--text-3);font-weight:500}
.locked .tile .lk{position:absolute;top:8px;inset-inline-end:calc(50% - 38px);width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-3)}
.locked .tile .lk svg{width:11px;height:11px}
/* Grouped modules (QEnterprise) */
.groups{display:flex;flex-wrap:wrap;gap:12px;padding:18px 16px 20px}
.group{flex:1 1 auto;border:1px solid var(--border);border-radius:14px;background:var(--surface-2);padding:12px 8px 6px}
.group h3{margin:0 8px 6px;font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.group h3::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--brand)}
.group h3 small{font-weight:500;color:var(--text-3)}
.gtiles{display:flex;flex-wrap:wrap}
.gtiles .tile-wrap{width:112px}
.group .tile:hover{background:var(--surface)}
.p-foot{display:flex;border-top:1px solid var(--border);background:var(--surface-2)}
.p-foot button{flex:1;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px}
.p-foot button+button{border-inline-start:1px solid var(--border)}
.p-foot .tour .play{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.p-foot .tour .play svg{width:10px;height:10px}
.p-foot .demo{color:var(--brand)}
.p-foot button:hover{background:var(--surface)}

/* Support */
.support{margin:36px 0 48px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.support::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.support .badge{width:44px;height:44px;border-radius:12px;background:#1b2a6b;color:var(--brand-2);display:grid;place-items:center;flex:none}
.support b{font-size:15px}
.support p{margin:2px 0 0;color:var(--text-2);font-size:13px}
.support .btn{margin-inline-start:auto}

/* Search dialog */
.overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;z-index:50}
.overlay.open{display:flex}
.dialog{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 24px 60px -12px rgba(0,0,0,.45);overflow:hidden}
.dlg-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border)}
.dlg-in input{flex:1;height:56px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px}
.dlg-in input::placeholder{color:var(--text-3)}
.results{max-height:56vh;overflow:auto;padding:8px}
.grp{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:10px 10px 4px}
.res{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border:0;background:transparent;border-radius:10px;text-align:start}
.res .mini{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.res .mini svg{width:16px;height:16px}
.res .t{flex:1;min-width:0}
.res .t b{display:block;font-weight:600;font-size:14px}
.res .t small{color:var(--text-3);font-size:12px}
.res .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--lock-bg);color:var(--text-2);white-space:nowrap}
.res.lockd .mini{background:var(--lock-bg)!important;color:var(--lock-ink)}
.res.active{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-strong)}
.dlg-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);color:var(--text-3);font-size:12px;flex-wrap:wrap}
.noresult{padding:28px;text-align:center;color:var(--text-3)}
mark{background:rgba(60,200,232,.28);color:inherit;border-radius:3px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#14204a;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:calc(100% - 32px)}
:root[data-theme="dark"] .toast{background:#e9eeff;color:#14204a}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  .topbar .wrap{gap:8px}
  .searchbtn span:not(.kbd),.searchbtn .kbd{display:none}
  .searchbtn{flex:0 0 40px;width:40px;padding:0;justify-content:center;margin-inline-start:auto}
  .welcome{flex-wrap:wrap;padding:20px}
  .welcome h1{font-size:21px}
  .tfa{margin-inline-start:0;width:100%}
  .p-actions{margin-inline-start:0;width:100%;flex-wrap:wrap}
  .p-actions .btn{width:100%;justify-content:center}
  .tiles{grid-template-columns:repeat(3,1fr);padding:14px 6px}
  .tile .ic{width:52px;height:52px}
  .groups{padding:14px 10px}
  .group{flex-basis:100%}
  .gtiles .tile-wrap{width:33.333%}
  .quick-label{width:100%}
  .support{flex-wrap:wrap}
  .support .btn{margin-inline-start:0}
  .sec-sub{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="logo" aria-label="Qoyod">QOYOD<span class="dot"></span></div>
    <button class="searchbtn" id="openSearch" aria-label="Search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span data-i18n="searchPh"></span><span class="kbd">Ctrl K</span>
    </button>
    <button class="iconbtn" id="langBtn" aria-label="Language">ع</button>
    <button class="iconbtn" id="themeBtn" aria-label="Theme"></button>
    <div class="avatar" title="Ehab">EE</div>
  </div>
</header>

<main class="wrap">
  <section class="welcome">
    <div class="badge"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flip"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg></div>
    <div>
      <div class="date" id="today"></div>
      <h1 id="greet"></h1>
      <div class="who"><span data-i18n="signedAs"></span> <b>e.esmat@qoyod.com</b></div>
    </div>
    <div class="tfa"><span data-i18n="tfa"></span><a href="#" onclick="return false"><span data-i18n="turnOn"></span> →</a></div>
  </section>

  <h2 class="sec-title"><span data-i18n="quick"></span></h2>
  <section class="quick">
    <div class="quick-row"><div class="quick-label" data-i18n="pinned"></div><div class="quick-row" id="pinnedRow"></div></div>
    <div class="quick-row"><div class="quick-label" data-i18n="recent"></div><div class="quick-row" id="recentRow"></div></div>
  </section>

  <h2 class="sec-title"><span data-i18n="yourApps"></span><span class="count" id="ownedCount"></span><span class="sec-sub" data-i18n="yourAppsSub"></span></h2>
  <div id="owned"></div>

  <h2 class="sec-title alt"><span data-i18n="available"></span><span class="sec-sub" data-i18n="availableSub"></span></h2>
  <div id="available"></div>

  <section class="support">
    <div class="badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg></div>
    <div><b data-i18n="support"></b> <span class="status" data-i18n="availNow"></span><p data-i18n="supportSub"></p></div>
    <button class="btn btn-ghost" data-i18n="contact"></button>
  </section>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Search">
  <div class="dialog">
    <div class="dlg-in">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--text-3)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" autocomplete="off" spellcheck="false">
      <span class="kbd">Esc</span>
    </div>
    <div class="results" id="results"></div>
    <div class="dlg-foot"><span>↑ ↓ <span data-i18n="navigate"></span></span><span>Enter <span data-i18n="open"></span></span><span>Esc <span data-i18n="close"></span></span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Icons (24x24 stroke paths) ---------- */
const I = {
  trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  truck:'<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a1.5 1.5 0 0 0 1.5 1.1h8.8a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/>',
  clipcheck:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9z"/><path d="m9 13 2 2 4-4"/>',
  receipt:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  calc:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
  book:'<path d="M5 4a2 2 0 0 1 2-2h12v18H7a2 2 0 0 0-2 2z"/><path d="M5 20V4M10 2v7l2.5-1.5L15 9V2"/>',
  kanban:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7v7M12 7v4M16 7v10"/>',
  chart:'<path d="M3 3v18h18"/><path d="M8 17v-5M12 17V8M16 17v-8M20 17v-3"/>',
  network:'<rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-3h14v3"/>',
  sliders:'<path d="M5 3v18M12 3v18M19 3v18"/><rect x="3" y="7" width="4" height="5" rx="1"/><rect x="10" y="12" width="4" height="5" rx="1"/><rect x="17" y="6" width="4" height="5" rx="1"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3.5 6"/>',

/* ---------- Render ---------- */
function productLogo(p){
  const style = `--pc:${p.color};--pc-dark:${p.dark};--pacc:${p.acc}`;
  if (p.wordmark) return `<div class="p-logo" style="${style}">${esc(pName(p))}</div>`;
  return `<div class="p-logo" style="${style}"><span class="mark"></span>${esc(pName(p))}</div>`;
}
function tileHTML(m, locked){
  const pinned = pins.includes(m.key);
  return `<div class="tile-wrap" style="position:relative">
    <button class="tile" data-key="${m.key}" title="${esc(mName(m))}">
      <span class="ic" style="background:${m.color}">${svg(m.icon)}</span>
      <span class="nm">${esc(mName(m))}</span>
      ${locked ? `<span class="lk">${svg('lock','stroke-width="2.4"')}</span>` : ''}
    </button>
    ${locked ? '' : `<button class="pin ${pinned?'on':''}" data-pin="${m.key}" aria-label="${pinned?t('unpin'):t('pin')} ${esc(mName(m))}" title="${pinned?t('unpin'):t('pin')}">${svg('star', pinned?'fill="currentColor"':'')}</button>`}
  </div>`;
}
function productHTML(p){
  const head = p.owned
    ? `<div class="p-head">${productLogo(p)}
         <div class="p-meta"><div class="row"><span class="status">${t('active')}</span><span class="last">${p.modules.length} ${t('modules')}</span></div><div class="p-desc">${esc(p.desc[lang])}</div></div>
         <div class="p-actions"><span class="last">${t('lastSignIn')} ${esc(p.last[lang])}</span>
           <button class="btn btn-primary" data-continue="${p.id}">${t('cont')} ${esc(pName(p))} ${svg('arrow','class="flip"')}</button></div></div>`
    : `<div class="p-head">${productLogo(p)}
         <div class="p-meta"><div class="row"><span class="status off">${t('notSubscribed')}</span><span class="last">${p.modules.length} ${t('modules')}</span></div><div class="p-desc">${esc(p.desc[lang])}</div></div></div>`;
  const foot = p.owned ? '' :
    `<div class="p-foot"><button class="tour" data-tour="${p.id}"><span class="play">${svg('play')}</span>${t('tour')}</button>
       <button class="demo" data-demo="${p.id}">${t('demo')} ${svg('arrow','class="flip" style="width:14px;height:14px"')}</button></div>`;
  const body = p.groups
    ? `<div class="groups">${p.groups.map(g => `<div class="group"><h3>${esc(lang==='ar'?g.ar:g.en)} <small>${g.modules.length}</small></h3><div class="gtiles">${g.modules.map(m => tileHTML(m,!p.owned)).join('')}</div></div>`).join('')}</div>`
    : `<div class="tiles">${p.modules.map(m => tileHTML(m,!p.owned)).join('')}</div>`;
  return `<section class="product ${p.owned?'':'locked'}">${head}${body}${foot}</section>`;
}
function chipHTML(k){
  const m = byKey[k];

}
function renderQuick(){
  document.getElementById('pinnedRow').innerHTML = pins.length ? pins.map(chipHTML).join('') : `<span class="empty">${t('noPins')}</span>`;

}
function render(){
  const root = document.documentElement;
  root.lang = lang; root.dir = lang==='ar' ? 'rtl' : 'ltr'; root.dataset.theme = theme;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.getElementById('q').placeholder = t('searchPh');
  document.getElementById('langBtn').textContent = lang==='ar' ? 'EN' : 'ع';
  document.getElementById('themeBtn').innerHTML = svg(theme==='dark' ? 'sun' : 'moon','width="18" height="18"');
  const now = new Date(), h = now.getHours();
  document.getElementById('today').textContent = now.toLocaleDateString(lang==='ar'?'ar-SA-u-ca-gregory-nu-latn':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('greet').textContent = `${t(h<12?'morning':h<18?'afternoon':'evening')}${lang==='ar'?'، إيهاب':', Ehab'}`;

let toastTimer;

function openModule(k){
  const m = byKey[k]; if (!m) return;
  if (!m.product.owned){ toast(`${pName(m.product)} → ${mName(m)} ${t('lockedToast')}`); return; }
  recent = [k, ...recent.filter(x => x !== k)].slice(0,6); store.set('recent', recent); renderQuick();
  toast(`${t('opening')} ${pName(m.product)} → ${mName(m)}`);
}
function togglePin(k){
  const on = pins.includes(k);
  pins = on ? pins.filter(x => x !== k) : [...pins, k]; store.set('pins', pins);
  document.querySelectorAll(`[data-pin="${k}"]`).forEach(b => { b.classList.toggle('on', !on); b.innerHTML = svg('star', !on?'fill="currentColor"':''); b.title = !on?t('unpin'):t('pin'); });
  renderQuick(); toast(`${on?t('unpinnedT'):t('pinnedT')}: ${mName(byKey[k])}`);
}
document.addEventListener('click', e => {
  const pin = e.target.closest('[data-pin]'); if (pin){ togglePin(pin.dataset.pin); return; }
  const el = e.target.closest('[data-key]'); if (el && !el.closest('#results')){ openModule(el.dataset.key); return; }
  const c = e.target.closest('[data-continue]'); if (c){ const p = PRODUCTS.find(x => x.id===c.dataset.continue); toast(`${t('opening')} ${pName(p)}`); return; }
  const d = e.target.closest('[data-demo]'); if (d){ const p = PRODUCTS.find(x => x.id===d.dataset.demo); toast(`${t('demo')} — ${pName(p)}`); return; }
  const tr = e.target.closest('[data-tour]'); if (tr){ const p = PRODUCTS.find(x => x.id===tr.dataset.tour); toast(`${t('tour')} — ${pName(p)}`); return; }
});
document.getElementById('langBtn').onclick = () => { lang = lang==='ar'?'en':'ar'; store.set('lang', lang); render(); };
document.getElementById('themeBtn').onclick = () => { theme = theme==='dark'?'light':'dark'; store.set('theme', theme); render(); };

/* ---------- Search ---------- */
const overlay = document.getElementById('overlay'), q = document.getElementById('q'), results = document.getElementById('results');
let hits = [], sel = 0;
function norm(s){ return s.toLowerCase().normalize('NFKD').replace(/[ً-ٟ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي'); }
function hl(text, query){
  if (!query) return esc(text);
  const i = norm(text).indexOf(norm(query));
  return i < 0 ? esc(text) : esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+query.length)) + '</mark>' + esc(text.slice(i+query.length));
}
function runSearch(){
  const query = q.value.trim(), nq = norm(query);
  let list = !query
    ? [...pins, ...recent.filter(k => !pins.includes(k))].map(k => byKey[k])
    : ALL.filter(m => [m.en, m.ar, m.product.name, m.product.nameAr, m.group?.en||'', m.group?.ar||''].some(s => norm(s).includes(nq)))
         .sort((a,b) => (b.product.owned - a.product.owned) || (norm(mName(a)).indexOf(nq) < 0) - (norm(mName(b)).indexOf(nq) < 0));
  hits = list.slice(0, 30); sel = 0;
  if (!hits.length){ results.innerHTML = `<div class="noresult">${t('noRes')} “${esc(query)}”</div>`; return; }
  let html = '', grp = null;
  hits.forEach((m, i) => {
    const g = !query ? t('quick') : (m.product.owned ? t('inYour') : t('inAvail'));
    if (g !== grp){ html += `<div class="grp">${g}</div>`; grp = g; }
    html += `<button class="res ${m.product.owned?'':'lockd'} ${i===sel?'active':''}" data-i="${i}">
      <span class="mini" style="background:${m.color}">${svg(m.product.owned?m.icon:'lock')}</span>
      <span class="t"><b>${hl(mName(m), query)}</b><small>${hl(pName(m.product), query)}${m.group ? ' · ' + hl(lang==='ar'?m.group.ar:m.group.en, query) : ''}</small></span>
      ${m.product.owned ? `<span style="color:var(--text-3)">${svg('arrow','class="flip" width="16" height="16"')}</span>` : `<span class="tag">${t('locked')}</span>`}
    </button>`;
  });
  results.innerHTML = html;
}
function setSel(i){
  sel = (i + hits.length) % hits.length;
  results.querySelectorAll('.res').forEach(r => r.classList.toggle('active', +r.dataset.i === sel));
  results.querySelector('.res.active')?.scrollIntoView({block:'nearest'});
}
function openSearch(){ overlay.classList.add('open'); q.value=''; runSearch(); setTimeout(() => q.focus(), 10); }
function closeSearch(){ overlay.classList.remove('open'); }
document.getElementById('openSearch').onclick = openSearch;
q.addEventListener('input', runSearch);
results.addEventListener('click', e => { const r = e.target.closest('.res'); if (r){ closeSearch(); openModule(hits[+r.dataset.i].key); } });
results.addEventListener('mousemove', e => { const r = e.target.closest('.res'); if (r && +r.dataset.i !== sel) setSel(+r.dataset.i); });
overlay.addEventListener('click', e => { if (e.target === overlay) closeSearch(); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); overlay.classList.contains('open') ? closeSearch() : openSearch(); return; }
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'Escape'){ closeSearch(); }
  else if (e.key === 'ArrowDown' && hits.length){ e.preventDefault(); setSel(sel+1); }
  else if (e.key === 'ArrowUp' && hits.length){ e.preventDefault(); setSel(sel-1); }
  else if (e.key === 'Enter' && hits[sel]){ e.preventDefault(); closeSearch(); openModule(hits[sel].key); }
});

render();
</script>
</body>
</html>
